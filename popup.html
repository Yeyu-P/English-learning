<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>美剧英语助手 - 设置</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 20px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
    }
    .logo-icon { font-size: 24px; }
    .logo-text { font-size: 16px; font-weight: 600; color: #f8fafc; }

    label {
      display: block;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input, select {
      width: 100%;
      padding: 8px 12px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus { border-color: #6366f1; }

    .field { margin-bottom: 16px; }

    .api-key-wrap { position: relative; }
    .api-key-wrap input { padding-right: 36px; }
    .toggle-eye {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      font-size: 15px;
      padding: 0;
    }

    .btn-save {
      width: 100%;
      padding: 10px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-save:hover { background: #4f46e5; }

    .toast {
      margin-top: 12px;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      text-align: center;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .toast.show { opacity: 1; }
    .toast.success { background: #064e3b; color: #6ee7b7; }
    .toast.error   { background: #450a0a; color: #fca5a5; }

    .shortcut-info {
      margin-top: 20px;
      padding: 12px;
      background: #1e293b;
      border-radius: 8px;
      font-size: 12px;
      color: #64748b;
      line-height: 1.6;
    }
    .shortcut-info kbd {
      background: #334155;
      color: #e2e8f0;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
    }

    .open-panel-btn {
      width: 100%;
      padding: 8px;
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 16px;
      transition: all 0.2s;
    }
    .open-panel-btn:hover { background: #334155; color: #e2e8f0; }

    .divider {
      border: none;
      border-top: 1px solid #1e293b;
      margin: 16px 0;
    }
  </style>
</head>
<body>
  <div class="logo">
    <span class="logo-icon">📺</span>
    <span class="logo-text">美剧英语助手</span>
  </div>

  <button class="open-panel-btn" id="openPanelBtn">📖 打开学习记录面板</button>

  <hr class="divider">

  <div class="field">
    <label>Claude API Key</label>
    <div class="api-key-wrap">
      <input type="password" id="apiKey" placeholder="sk-ant-api03-..." autocomplete="off">
      <button class="toggle-eye" id="toggleEye" type="button">👁</button>
    </div>
  </div>

  <div class="field">
    <label>模型</label>
    <select id="model">
      <option value="claude-sonnet-4-6">claude-sonnet-4-6（推荐）</option>
      <option value="claude-opus-4-7">claude-opus-4-7（最强，较慢）</option>
      <option value="claude-haiku-4-5-20251001">claude-haiku-4-5（最快，较弱）</option>
    </select>
  </div>

  <button class="btn-save" id="saveBtn">保存设置</button>
  <div class="toast" id="toast"></div>

  <div class="shortcut-info">
    快捷键：<kbd>Ctrl+Shift+E</kbd>（Mac: <kbd>⌘⇧E</kbd>）<br>
    截图后自动分析台词和词汇，结果显示在侧边栏。
  </div>

  <script src="popup.js"></script>
</body>
</html>
