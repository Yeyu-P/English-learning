<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>美剧英语助手</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div id="app">

    <!-- Header -->
    <div class="header">
      <span class="header-title">📺 英语学习记录</span>
      <div class="header-actions">
        <button id="exportBtn" title="导出为 JSON" class="btn-icon">⬇</button>
        <button id="clearBtn" title="清空所有记录" class="btn-icon btn-danger">🗑</button>
      </div>
    </div>

    <!-- Empty state -->
    <div id="emptyState" class="empty-state hidden">
      <div class="empty-icon">📸</div>
      <div class="empty-title">还没有记录</div>
      <div class="empty-hint">按 <kbd>Ctrl+Shift+E</kbd> 截图开始学习</div>
    </div>

    <!-- Records list -->
    <div id="recordsList"></div>

  </div>

  <script src="panel.js"></script>
</body>
</html>
